<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Carrinho</title>

  <style>

    *,
    *::before,
    *::after
    {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body
    {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system,
                   BlinkMacSystemFont,
                   'Segoe UI',
                   Inter,
                   Helvetica,
                   Arial,
                   sans-serif;

      min-height: 100vh;
      padding: 48px 56px;
    }

    .cart-layout
    {
      display: flex;
      gap: 48px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .cart-items
    {
      flex: 1.4;
    }

    .cart-items h1
    {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin-bottom: 32px;
    }

    .item-card
    {
      background-color: #1e1e1e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .item-card img
    {
      width: 120px;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .item-info h2
    {
      margin-bottom: 10px;
    }

    .item-info p
    {
      margin-bottom: 8px;
      color: #ccc;
    }

    .cart-summary
    {
      flex: 0.8;
      padding-top: 68px;
    }

    .summary-box h2
    {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .summary-row
    {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .summary-label
    {
      color: #b3b3b3;
      font-size: 15px;
    }

    .summary-value
    {
      color: #ffffff;
      font-size: 14px;
      text-align: right;
    }

    .summary-divider
    {
      border: none;
      border-top: 1px solid #404040;
      margin: 24px 0;
    }

    .btn-checkout
    {
      display: block;
      width: 100%;
      padding: 16px 0;
      background-color: #00a9ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
      text-decoration: none;
    }

    .btn-checkout:hover
    {
      background-color: #008fdb;
    }

    @media (max-width: 768px)
    {
      body
      {
        padding: 28px 20px;
      }

      .cart-layout
      {
        flex-direction: column;
        gap: 36px;
      }

      .cart-summary
      {
        padding-top: 0;
      }

      .item-card
      {
        flex-direction: column;
        text-align: center;
      }
    }

  </style>
</head>

<body>
  <a href="/" style="position:fixed; top:20px; left:20px; color:#FFFFFF; font-size:1.5rem; text-decoration:none; z-index:999;">&#8592;</a>

  <div class="cart-layout">

    <section class="cart-items">

      <h1>Meu carrinho</h1>

    </section>

    <aside class="cart-summary">

      <div class="summary-box">

        <h2>Resumo</h2>

        <div class="summary-row">
          <span class="summary-label">
            Preço
          </span>

          <span class="summary-value">
            R$ 0,00
          </span>
        </div>

        <div class="summary-row">
          <span class="summary-label">
            Impostos
          </span>

          <span class="summary-value">
            Calculado ao finalizar
          </span>
        </div>

        <hr class="summary-divider">

        <button
          class="btn-checkout"
          type="button">

          Finalizar compra

        </button>

      </div>

    </aside>

  </div>

  <script>

    async function carregarCarrinho()
    {
      const response =
        await fetch('/Carrinho/ObterItens');
      const itens =
        await response.json();
      const cartItems =
        document.querySelector('.cart-items');
      const summaryValue =
            document.querySelector('.summary-value');
      cartItems.innerHTML = '<h1>Meu carrinho</h1>';
      let total = 0;
      itens.forEach(item =>
      {
        total +=
          item.preco * item.quantidade;
        cartItems.innerHTML += `
        <div class="item-card">
          <img src="${item.imagem}">
          <div class="item-info">
            <h2>${item.nome}</h2>
            <div style="margin-bottom: 12px;">
                <span style="color: #ccc;">Qtd:</span>
                <input
                    type="number"
                    class="quantidade-input"
                    value="${item.quantidade}" 
                    min="1" 
                    data-produto-id="${item.produtoId}"
                    style="width: 50px; background: #2a2a2a; color: white; border: 1px solid #404040; border-radius: 4px; padding: 2px;"
                />
            </div>
            <h3>R$ ${item.preco.toFixed(2)}</h3>
          </div>
        </div>
        `;
      });
        summaryValue.innerText =
            `R$ ${total.toFixed(2)}`;
            configurarEventosQuantidade();
    }
      function configurarEventosQuantidade() {
          document.querySelectorAll('.quantidade-input').forEach(input => {
              input.addEventListener('change', async function () {
                  const pId = parseInt(this.getAttribute('data-produto-id'));
                  const novaQtd = parseInt(this.value);

                  if (novaQtd < 1) {
                      this.value = 1;
                      return;
                  }

                  const response = await fetch('/Carrinho/Alterar', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ ProdutoId: pId, NovaQuantidade: novaQtd })
                  });

                  if (response.ok) {
                      const dados = await response.json();
                      document.querySelector('.summary-value').innerText = `R$ ${dados.total.toFixed(2)}`;
                  } else {
                      alert('Erro ao atualizar (Verifique o estoque).');
                      carregarCarrinho();
                  }
              });
          });
      }

    carregarCarrinho();

  </script>

</body>
</html>
